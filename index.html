<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leitor</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="estilo.css?v=15">
  <script src="logica.js?v=15" defer></script>
  <script src="app.js?v=15" defer></script>
</head>
<body>
  <header class="topo">
    <button id="abrir-pastas" class="so-estreito" title="Pastas e feeds">☰</button>
    <nav class="abas">
      <button class="aba ativa" data-aba="noticias">Notícias <span id="contador"></span></button>
      <button class="aba" data-aba="barradas">Barradas</button>
    </nav>
    <div class="acoes">
      <button id="atualizar" title="Buscar matérias novas">⟳</button>
      <button id="abrir-config" title="Configuração">⚙</button>
    </div>
  </header>
  <div id="status" hidden></div>

  <main class="corpo">
    <nav id="pastas" aria-label="Pastas e feeds">
      <ul id="arvore"></ul>
      <button id="abrir-novo-feed" class="novo-feed">+ Adicionar feed</button>
    </nav>
    <div id="fundo-pastas" class="so-estreito" hidden></div>

    <section id="lista-painel">
      <h2 id="selecao-titulo"></h2>
      <div class="filtros" id="filtros">
        <label><input type="checkbox" id="so-nao-lidas" checked> Só não lidas</label>
        <button id="marcar-todas">Marcar todas como lidas</button>
      </div>
      <ul id="lista"></ul>
      <p id="vazio" hidden></p>
    </section>

    <article id="leitura" hidden>
      <button id="voltar" class="voltar">← Voltar</button>
      <h1 id="l-titulo"><a id="l-titulo-link" target="_blank" rel="noopener noreferrer"></a></h1>
      <p id="l-meta" class="meta"></p>
      <img id="l-imagem" alt="" referrerpolicy="no-referrer" hidden>
      <div id="l-texto"></div>
      <p id="l-motivo" class="motivo"></p>
      <section id="l-comentarios" hidden>
        <button id="l-ver-comentarios"></button>
        <ol id="l-lista-comentarios"></ol>
      </section>
      <p class="rodape-leitura">
        <a id="l-link" target="_blank" rel="noopener noreferrer">Abrir no site ↗</a>
        <button id="l-nao-lida">Marcar como não lida</button>
      </p>
    </article>
  </main>

  <dialog id="novo-feed">
    <form method="dialog" id="novo-feed-form">
      <h2>Adicionar feed</h2>
      <label>Endereço do feed RSS
        <input type="url" id="nf-url" placeholder="https://site.com/feed/" required>
      </label>
      <label>Nome
        <input type="text" id="nf-nome" placeholder="Nome curto que aparece na lista" required>
      </label>
      <label>Pasta
        <input type="text" id="nf-pasta" list="nf-pastas" placeholder="Escolha ou digite uma nova" required>
        <datalist id="nf-pastas"></datalist>
      </label>
      <label class="linha"><input type="checkbox" id="nf-filtrar"> Passar pelo filtro (perfil.md)</label>
      <p id="nf-msg"></p>
      <menu>
        <button type="button" id="nf-salvar">Adicionar</button>
        <button value="fechar" formnovalidate>Cancelar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="config">
    <form method="dialog" id="config-form">
      <h2>Configuração</h2>
      <p>
        Cole um token do GitHub (fine-grained) com acesso só ao repositório
        <code>news_feed</code>, permissões <b>Contents</b> e <b>Actions</b> em
        leitura e escrita.
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Criar token ↗</a>
      </p>
      <input type="password" id="token" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <p id="config-msg"></p>
      <menu>
        <button type="button" id="testar-token">Testar e salvar</button>
        <button value="fechar" formnovalidate>Fechar</button>
      </menu>
    </form>
  </dialog>
</body>
</html>
